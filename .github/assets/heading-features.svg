<svg xmlns="http://www.w3.org/2000/svg" width="900" height="86" viewBox="0 0 900 86" role="img" aria-label="FEATURES">
  <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff004c"><animate attributeName="stop-color" values="#ff004c;#ff7e00;#fcd805;#b6fe00;#00e5ff;#7c4dff;#ff004c" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="25%" stop-color="#ff7e00"><animate attributeName="stop-color" values="#ff7e00;#fcd805;#b6fe00;#00e5ff;#7c4dff;#ff004c;#ff7e00" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#b6fe00"><animate attributeName="stop-color" values="#b6fe00;#00e5ff;#7c4dff;#ff004c;#ff7e00;#fcd805;#b6fe00" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="75%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#7c4dff;#ff004c;#ff7e00;#fcd805;#b6fe00;#00e5ff" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7c4dff"><animate attributeName="stop-color" values="#7c4dff;#ff004c;#ff7e00;#fcd805;#b6fe00;#00e5ff;#7c4dff" dur="5s" repeatCount="indefinite"/></stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
