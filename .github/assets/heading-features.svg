  <rect x="0" y="10" width="900" height="66" rx="16" fill="#16110a"/>
  <text x="26" y="55" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#g)">✨ FEATURES</text>
  <rect x="26" y="66" width="200" height="5" rx="2.5" fill="url(#g)">
    <animate attributeName="width" values="80;520;80" dur="6s" repeatCount="indefinite"/>
  </rect>
